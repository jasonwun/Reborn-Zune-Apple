<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Up Next rail or panel</title>
  <!-- Two Now Playing queue variants, switchable via ?variant=A|B. Throwaway decision aid only. -->
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f1ec;
      --muted: rgba(244, 241, 236, .58);
      --faint: rgba(244, 241, 236, .12);
      --magenta: #e4007f;
      --black: #0e0d0a;
      --panel: rgba(17, 15, 18, .94);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #09090b; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { height: 100vh; overflow: hidden; }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid #ff4aa2; outline-offset: 3px; }
    .prototype-bar {
      height: 58px; display: flex; align-items: center; gap: 18px; padding: 0 22px;
      background: #17171b; border-bottom: 1px solid #2b2b31; position: relative; z-index: 20;
    }
    .prototype-badge { color: #ff65ae; font: 700 10px/1 ui-monospace, monospace; letter-spacing: 1.5px; white-space: nowrap; }
    .variant-heading { min-width: 0; flex: 1; }
    .variant-heading strong { display: block; font-size: 14px; font-weight: 600; }
    .variant-heading span { display: block; margin-top: 3px; color: #9b9ba5; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .width-switch { display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: #0c0c0f; }
    .width-switch button { border: 0; border-radius: 5px; padding: 6px 11px; color: #92929d; background: transparent; cursor: pointer; font-size: 12px; }
    .width-switch button.active { background: #34343d; color: white; }
    .state-strip {
      height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 22px;
      background: #101014; border-bottom: 1px solid #25252b; color: #858590;
      font: 10px/1.2 ui-monospace, SFMono-Regular, monospace; white-space: nowrap; overflow: hidden;
    }
    .state-strip strong { color: #c8c8d0; font-weight: 500; flex: none; }
    #stateText { overflow: hidden; text-overflow: ellipsis; }
    .stage { height: calc(100vh - 92px); padding-bottom: 78px; display: flex; justify-content: center; background: #09090b; }
    .viewport { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--black); transition: width .25s ease; }
    .viewport.narrow { width: min(820px, 100%); border-inline: 1px solid #333139; }
    .tile-wall { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 25%; filter: saturate(.65); opacity: .76; }
    .tile { position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,.45); background: var(--tile); }
    .tile::before { content: ""; position: absolute; inset: 12%; border: 1px solid rgba(255,255,255,.16); transform: rotate(var(--turn)); }
    .tile::after { content: ""; position: absolute; width: 56%; aspect-ratio: 1; left: 22%; top: 22%; border-radius: var(--shape); background: rgba(8,8,12,.35); box-shadow: 0 0 45px rgba(255,255,255,.1) inset; }
    .wall-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,8,14,.1), rgba(10,8,14,.28)), linear-gradient(0deg, rgba(5,5,8,.86), transparent 52%); }
    .back-ring { position: absolute; width: 130px; height: 130px; left: -45px; top: -46px; border: 8px solid rgba(244,241,236,.8); border-radius: 50%; background: rgba(255,255,255,.04); color: white; font: 300 70px/1 sans-serif; padding: 12px 0 0 48px; }
    .variant-note { position: absolute; top: 26px; left: 112px; max-width: 410px; padding: 13px 15px; border-left: 2px solid var(--magenta); background: rgba(10,9,13,.66); backdrop-filter: blur(10px); }
    .variant-note strong { font-size: 13px; font-weight: 600; }
    .variant-note p { margin: 5px 0 0; color: rgba(244,241,236,.68); font-size: 11px; line-height: 1.55; }
    .meta-card { position: absolute; left: 34px; bottom: 154px; display: flex; align-items: flex-end; gap: 16px; max-width: calc(100% - 430px); }
    .cover { width: 112px; height: 112px; flex: none; background: linear-gradient(145deg, #d6a6bb, #542440 48%, #14131b 49%); border: 1px solid rgba(255,255,255,.18); position: relative; overflow: hidden; }
    .cover::before { content: ""; position: absolute; width: 80px; height: 80px; border: 14px solid rgba(255,255,255,.28); border-radius: 50%; left: 22px; top: 16px; }
    .cover::after { content: "REBORN"; position: absolute; left: 10px; bottom: 8px; font: 700 9px/1 ui-monospace, monospace; letter-spacing: 3px; }
    .track-title { font-size: 27px; font-weight: 300; letter-spacing: -.5px; }
    .track-meta { margin-top: 7px; color: var(--muted); font: 9px/1.4 ui-monospace, monospace; letter-spacing: 1.5px; text-transform: uppercase; }
    .scrubber { position: absolute; left: 34px; right: 34px; bottom: 96px; display: flex; align-items: center; gap: 16px; color: rgba(244,241,236,.75); font: 10px/1 ui-monospace, monospace; }
    .scrub-line { height: 2px; flex: 1; background: rgba(244,241,236,.25); position: relative; }
    .scrub-fill { width: 37%; height: 100%; background: var(--magenta); }
    .scrub-fill::after { content: ""; position: absolute; left: calc(37% - 5px); top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--magenta); }
    .transport { position: absolute; left: 34px; right: 34px; bottom: 26px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .transport-left, .transport-center, .transport-right { display: flex; align-items: center; gap: 22px; }
    .transport-center { gap: 26px; }
    .transport-right { justify-content: flex-end; }
    .icon-button { border: 0; background: transparent; color: rgba(244,241,236,.86); cursor: pointer; min-width: 30px; height: 32px; padding: 3px; font-size: 18px; border-radius: 4px; }
    .icon-button:hover { background: rgba(255,255,255,.08); }
    .icon-button.active { color: #ff3b9d; }
    .play-button { width: 50px; height: 50px; border: 0; border-radius: 50%; background: var(--magenta); color: #160d13; cursor: pointer; font-size: 18px; }
    .volume { display: flex; align-items: center; gap: 9px; color: var(--muted); font: 10px/1 ui-monospace, monospace; }
    .volume-track { width: 68px; height: 2px; background: linear-gradient(90deg, var(--ink) 72%, rgba(244,241,236,.25) 72%); }
    .summary-rail { position: absolute; right: 30px; bottom: 154px; width: 286px; }
    .eyebrow { color: rgba(244,241,236,.68); font: 500 9px/1 ui-monospace, monospace; letter-spacing: 2px; }
    .summary-list { margin-top: 11px; }
    .summary-row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; align-items: center; gap: 9px; min-height: 45px; border-bottom: 1px solid rgba(244,241,236,.2); }
    .summary-row:first-child { border-top: 1px solid rgba(244,241,236,.2); }
    .summary-number, .summary-duration { color: var(--muted); font: 9px/1 ui-monospace, monospace; }
    .summary-title { font-size: 18px; font-weight: 300; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-hint { margin-top: 10px; color: rgba(244,241,236,.48); font-size: 10px; }
    .editable-rail, .editor-panel { position: absolute; z-index: 8; background: var(--panel); backdrop-filter: blur(22px); border-left: 1px solid rgba(255,255,255,.13); box-shadow: -18px 0 60px rgba(0,0,0,.25); display: flex; flex-direction: column; transition: transform .3s ease, opacity .3s ease; }
    .editable-rail { top: 26px; right: 28px; bottom: 150px; width: 348px; border: 1px solid rgba(255,255,255,.13); }
    .editor-panel { top: 0; right: 0; bottom: 0; width: 440px; }
    .editable-rail.closed, .editor-panel.closed { transform: translateX(calc(100% + 36px)); opacity: 0; pointer-events: none; }
    .editor-head { flex: none; padding: 20px 20px 14px; border-bottom: 1px solid var(--faint); }
    .editor-title-line { display: flex; align-items: center; gap: 10px; }
    .editor-title-line .eyebrow { flex: 1; color: var(--ink); }
    .queue-count { color: var(--muted); font: 10px/1 ui-monospace, monospace; }
    .text-button { border: 0; background: transparent; color: rgba(244,241,236,.65); cursor: pointer; padding: 5px 6px; font-size: 11px; border-radius: 4px; }
    .text-button:hover { color: white; background: rgba(255,255,255,.08); }
    .text-button.danger:hover { color: #ff65ae; }
    .editor-description { margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .queue-list { flex: 1; min-height: 0; overflow-y: auto; padding: 7px 10px 14px; scrollbar-color: #55404b transparent; }
    .queue-row { display: grid; grid-template-columns: 20px 24px minmax(0,1fr) auto 26px; align-items: center; gap: 7px; min-height: 59px; padding: 6px 4px; border-bottom: 1px solid var(--faint); background: transparent; }
    .queue-row.dragging { opacity: .35; }
    .queue-row.drag-target { border-top: 2px solid var(--magenta); }
    .drag-handle { color: rgba(244,241,236,.32); cursor: grab; letter-spacing: -3px; user-select: none; }
    .queue-number { color: var(--muted); font: 9px/1 ui-monospace, monospace; }
    .queue-copy { min-width: 0; }
    .queue-title { font-size: 15px; font-weight: 350; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-artist { margin-top: 4px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-duration { color: var(--muted); font: 9px/1 ui-monospace, monospace; }
    .delete-button { border: 0; background: transparent; color: rgba(244,241,236,.4); cursor: pointer; width: 25px; height: 25px; border-radius: 50%; opacity: 0; }
    .queue-row:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: white; background: rgba(228,0,127,.5); }
    .empty-state { margin: 32px 12px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .empty-state button { margin-top: 10px; }
    .panel-close { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px; }
    .panel-backdrop { position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.48); opacity: 0; pointer-events: none; transition: opacity .3s; }
    .viewport.narrow .panel-backdrop.visible { opacity: 1; pointer-events: auto; }
    .viewport.narrow .variant-note { left: 86px; max-width: 330px; }
    .viewport.narrow .meta-card { max-width: calc(100% - 48px); left: 24px; }
    .viewport.narrow .summary-rail { display: none; }
    .viewport.narrow .editable-rail { top: 0; right: 0; bottom: 0; width: min(390px, calc(100% - 32px)); border-block: 0; border-right: 0; }
    .viewport.narrow .cover { width: 86px; height: 86px; }
    .viewport.narrow .track-title { font-size: 22px; }
    .viewport.narrow .volume-track { width: 44px; }
    .switcher { position: fixed; z-index: 50; left: 50%; bottom: 15px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; background: #f3f1ee; color: #17171b; border-radius: 13px; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
    .switcher button { width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #17171b; cursor: pointer; font-size: 18px; }
    .switcher button:hover { background: #d9d5d7; }
    .switcher-label { min-width: 230px; text-align: center; }
    .switcher-label strong { display: block; font-size: 12px; }
    .switcher-label span { display: block; margin-top: 2px; color: #6d6870; font-size: 9px; }
    .decision-hint { position: fixed; z-index: 40; left: 18px; bottom: 18px; max-width: calc(50% - 160px); color: #777781; font-size: 10px; line-height: 1.4; }
    @media (max-width: 900px) {
      .prototype-badge, .decision-hint { display: none; }
      .variant-heading span { max-width: 300px; }
      .switcher-label { min-width: 170px; }
      .variant-note { display: none; }
      .transport { left: 20px; right: 20px; }
      .volume { display: none; }
    }
  </style>
</head>
<body>
  <header class="prototype-bar">
    <span class="prototype-badge">THROWAWAY PROTOTYPE</span>
    <div class="variant-heading"><strong id="variantName"></strong><span id="variantDescription"></span></div>
    <div class="width-switch" aria-label="窗口宽度">
      <button type="button" data-action="wide" class="active">宽窗口</button>
      <button type="button" data-action="narrow">窄窗口</button>
    </div>
  </header>
  <div class="state-strip"><strong>实时状态</strong><span id="stateText"></span></div>
  <main class="stage">
    <section id="viewport" class="viewport wide" aria-label="Now Playing 交互原型"></section>
  </main>
  <div class="decision-hint">操作队列后切换方案，两种界面会保留同一份 Queue 状态。</div>
  <nav class="switcher" aria-label="原型方案切换">
    <button type="button" data-action="previous" aria-label="上一个方案">←</button>
    <div class="switcher-label"><strong id="switcherName"></strong><span>也可以用键盘左右方向键切换</span></div>
    <button type="button" data-action="next" aria-label="下一个方案">→</button>
  </nav>

  <script>
    const initialQueue = [
      { id: 1, title: "Butter-Fly", artist: "Demo Artist", duration: "4:16" },
      { id: 2, title: "Dat Stick", artist: "Demo Artist", duration: "2:09" },
      { id: 3, title: "Don’t Leave Me Behind", artist: "Demo Ensemble", duration: "4:00" },
      { id: 4, title: "Magenta Lights", artist: "Demo Artist", duration: "3:42" },
      { id: 5, title: "Night Drive", artist: "Demo Ensemble", duration: "5:08" },
      { id: 6, title: "Parallel Lines", artist: "Demo Artist", duration: "3:18" },
      { id: 7, title: "After the Rain", artist: "Demo Ensemble", duration: "4:37" },
      { id: 8, title: "Last Train Home", artist: "Demo Artist", duration: "3:55" }
    ];
    let queue = initialQueue.map(track => ({ ...track }));
    let variant = new URLSearchParams(location.search).get("variant") === "B" ? "B" : "A";
    let width = "wide";
    let open = { A: true, B: false };
    let lastAction = "初始 Queue 已载入";
    let draggedId = null;

    const variants = {
      A: {
        name: "方案 A · 可编辑侧栏",
        description: "☰ 切换唯一 Up Next 侧栏；完整 Queue 可直接管理",
        note: "看到什么，就能直接改什么。宽窗口是侧栏；窄窗口演示同一编辑器转为覆盖层。"
      },
      B: {
        name: "方案 B · 摘要 + 管理面板",
        description: "侧栏只显示接下来 3 首；☰ 打开独立完整管理面板",
        note: "平时看轻量摘要，需要整理时再打开面板。宽窄窗口共用同一个管理面板。"
      }
    };

    const viewport = document.getElementById("viewport");

    function tileWall() {
      const colors = ["#433044", "#8d647c", "#25242e", "#73536d", "#a58191", "#29232b", "#614454", "#352b40", "#94727d", "#3b2839", "#725263", "#211e28"];
      return `<div class="tile-wall">${Array.from({ length: 24 }, (_, i) => `<div class="tile" style="--tile:${colors[i % colors.length]};--turn:${(i % 5) * 9 - 18}deg;--shape:${i % 3 === 0 ? "50%" : "4%"}"></div>`).join("")}</div><div class="wall-shade"></div>`;
    }

    function transport() {
      return `
        <div class="scrubber"><span>1:34</span><div class="scrub-line"><div class="scrub-fill"></div></div><span>−2:42</span></div>
        <div class="transport">
          <div class="transport-left"><button class="icon-button" aria-label="随机播放">⤨</button><button class="icon-button" aria-label="重复播放">↻</button></div>
          <div class="transport-center"><button class="icon-button" aria-label="上一首">◀◀</button><button class="play-button" aria-label="暂停">Ⅱ</button><button class="icon-button" aria-label="下一首">▶▶</button></div>
          <div class="transport-right"><button class="icon-button ${open[variant] ? "active" : ""}" data-action="toggle-queue" aria-label="Up Next">☰</button><div class="volume">◖))<div class="volume-track"></div><span>72</span></div></div>
        </div>`;
    }

    function queueRows() {
      if (!queue.length) return `<div class="empty-state">Queue 已清空，当前歌曲继续播放。<br><button class="text-button" data-action="reset">恢复演示曲目</button></div>`;
      return queue.map((track, index) => `
        <div class="queue-row" draggable="true" data-id="${track.id}">
          <span class="drag-handle" title="拖拽排序">⋮⋮</span>
          <span class="queue-number">${String(index + 1).padStart(2, "0")}</span>
          <div class="queue-copy"><div class="queue-title">${track.title}</div><div class="queue-artist">${track.artist}</div></div>
          <span class="queue-duration">${track.duration}</span>
          <button class="delete-button" data-action="delete" data-id="${track.id}" aria-label="从 Queue 删除 ${track.title}">×</button>
        </div>`).join("");
    }

    function editor(kind) {
      const isOpen = open[variant];
      return `<aside class="${kind} ${isOpen ? "" : "closed"}" aria-label="Up Next 编辑器">
        <div class="editor-head">
          <div class="editor-title-line"><span class="eyebrow">UP NEXT</span><span class="queue-count">${queue.length} 首</span><button class="text-button danger" data-action="clear">Clear</button>${kind === "editor-panel" ? `<button class="text-button panel-close" data-action="toggle-queue" aria-label="关闭">×</button>` : ""}</div>
          <p class="editor-description">拖拽 ⋮⋮ 排序 · 悬停行点击 × 删除<br>Clear 清空待播曲目，保留当前歌曲</p>
        </div>
        <div class="queue-list">${queueRows()}</div>
      </aside>`;
    }

    function summary() {
      return `<aside class="summary-rail"><div class="eyebrow">UP NEXT</div><div class="summary-list">${queue.slice(0, 3).map((track, index) => `
        <div class="summary-row"><span class="summary-number">${String(index + 1).padStart(2, "0")}</span><span class="summary-title">${track.title}</span><span class="summary-duration">${track.duration}</span></div>`).join("") || `<div class="empty-state">没有待播曲目</div>`}</div><div class="summary-hint">只读摘要 · 点击底部 ☰ 管理完整 Queue</div></aside>`;
    }

    function render() {
      const copy = variants[variant];
      document.getElementById("variantName").textContent = copy.name;
      document.getElementById("variantDescription").textContent = copy.description;
      document.getElementById("switcherName").textContent = `${variant} / 2 · ${variant === "A" ? "可编辑侧栏" : "摘要 + 管理面板"}`;
      document.querySelectorAll(".width-switch button").forEach(button => button.classList.toggle("active", button.dataset.action === width));
      viewport.className = `viewport ${width}`;
      viewport.innerHTML = `
        ${tileWall()}
        <div class="back-ring">‹</div>
        <div class="variant-note"><strong>${copy.name}</strong><p>${copy.note}</p></div>
        <div class="meta-card"><div class="cover"></div><div><div class="track-title">Digital Love</div><div class="track-meta">Demo Artist · 4:16</div></div></div>
        ${variant === "A" ? editor("editable-rail") : summary() + editor("editor-panel")}
        <div class="panel-backdrop ${open[variant] ? "visible" : ""}" data-action="close-narrow"></div>
        ${transport()}`;
      const order = queue.length ? queue.map((track, i) => `${i + 1}.${track.title}`).join(" → ") : "空";
      document.getElementById("stateText").textContent = `${width === "wide" ? "宽窗口" : "窄窗口"} · ${open[variant] ? (variant === "A" ? "侧栏已展开" : "面板已展开") : (variant === "A" ? "侧栏已收起" : "面板已关闭")} · ${lastAction} · Queue [${order}]`;
      document.title = `${copy.name} — Up Next prototype`;
    }

    function switchVariant(nextVariant) {
      variant = nextVariant;
      const url = new URL(location.href);
      url.searchParams.set("variant", variant);
      history.replaceState(null, "", url);
      lastAction = "切换到同一 Queue 的另一呈现方式";
      render();
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "previous" || action === "next") {
        switchVariant(variant === "A" ? "B" : "A");
      } else if (action === "wide" || action === "narrow") {
        width = action;
        lastAction = `切换为${width === "wide" ? "宽" : "窄"}窗口`;
        render();
      } else if (action === "toggle-queue") {
        open[variant] = !open[variant];
        lastAction = open[variant] ? "打开 Queue" : "关闭 Queue";
        render();
      } else if (action === "close-narrow" && width === "narrow") {
        open[variant] = false;
        lastAction = "点击背景关闭 Queue";
        render();
      } else if (action === "delete") {
        const id = Number(button.dataset.id);
        const removed = queue.find(track => track.id === id);
        queue = queue.filter(track => track.id !== id);
        lastAction = `删除 ${removed.title}`;
        render();
      } else if (action === "clear") {
        queue = [];
        lastAction = "Clear 清空待播 Queue";
        render();
      } else if (action === "reset") {
        queue = initialQueue.map(track => ({ ...track }));
        lastAction = "恢复演示 Queue";
        render();
      }
    });

    document.addEventListener("dragstart", event => {
      const row = event.target.closest(".queue-row");
      if (!row) return;
      draggedId = Number(row.dataset.id);
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", String(draggedId));
    });
    document.addEventListener("dragover", event => {
      const row = event.target.closest(".queue-row");
      if (!row || draggedId === null) return;
      event.preventDefault();
      document.querySelectorAll(".drag-target").forEach(element => element.classList.remove("drag-target"));
      if (Number(row.dataset.id) !== draggedId) row.classList.add("drag-target");
    });
    document.addEventListener("drop", event => {
      const row = event.target.closest(".queue-row");
      if (!row || draggedId === null) return;
      event.preventDefault();
      const targetId = Number(row.dataset.id);
      if (targetId !== draggedId) {
        const moving = queue.find(track => track.id === draggedId);
        const withoutMoving = queue.filter(track => track.id !== draggedId);
        const targetIndex = withoutMoving.findIndex(track => track.id === targetId);
        withoutMoving.splice(targetIndex, 0, moving);
        queue = withoutMoving;
        lastAction = `将 ${moving.title} 拖到第 ${targetIndex + 1} 首`;
      }
      draggedId = null;
      render();
    });
    document.addEventListener("dragend", () => { draggedId = null; render(); });
    document.addEventListener("keydown", event => {
      if (event.target.matches("input, textarea, [contenteditable]")) return;
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        switchVariant(variant === "A" ? "B" : "A");
      }
      if (event.key === "Escape" && open[variant]) {
        open[variant] = false;
        lastAction = "按 Escape 关闭 Queue";
        render();
      }
    });

    render();
  </script>
</body>
</html>
